<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎂 Happy Birthday！</title>
<style>
/* ============================================================
   🎂 生日祝福网页
   ============================================================
   【用户可修改内容区 — 在文件底部 JS 中修改】
   1. stories       - 故事句子数组
   2. totalStories  - 标题中的数字（默认 20）
   3. birthdayName  - 祝福对象的名字
   ============================================================ */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  font-family: Georgia, "宋体", "SimSun", serif;
  -webkit-font-smoothing: antialiased;
}
body { background: #0a0a1a; color: #f5e6ca; }

/* ===== 密码保护界面 ===== */
#password-screen {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  z-index: 10000;
  transition: opacity 0.8s ease, visibility 0.8s ease;
}
#password-screen.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.password-box {
  text-align: center;
  padding: 40px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}
.password-icon {
  font-size: 60px;
  margin-bottom: 20px;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}
.password-title {
  font-size: 24px;
  color: #f6c343;
  margin-bottom: 10px;
  font-weight: bold;
}
.password-subtitle {
  font-size: 14px;
  color: #a0a0a0;
  margin-bottom: 30px;
}
.password-input {
  width: 250px;
  padding: 15px 20px;
  font-size: 18px;
  text-align: center;
  border: 2px solid rgba(246, 195, 67, 0.3);
  border-radius: 10px;
  background: rgba(0, 0, 0, 0.3);
  color: #f5e6ca;
  outline: none;
  transition: all 0.3s ease;
  letter-spacing: 5px;
}
.password-input:focus {
  border-color: #f6c343;
  box-shadow: 0 0 20px rgba(246, 195, 67, 0.3);
}
.password-input::placeholder {
  color: rgba(255, 255, 255, 0.3);
  letter-spacing: 3px;
}
.password-btn {
  margin-top: 20px;
  padding: 12px 40px;
  font-size: 16px;
  color: #1a1a2e;
  background: linear-gradient(135deg, #f6c343, #f0a6ca);
  border: none;
  border-radius: 25px;
  cursor: pointer;
  transition: all 0.3s ease;
  font-weight: bold;
}
.password-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 20px rgba(246, 195, 67, 0.4);
}
.password-error {
  margin-top: 15px;
  color: #ff6b6b;
  font-size: 14px;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.password-error.show {
  opacity: 1;
}

/* ===== 故事阶段 ===== */
#story-stage {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 20px; z-index: 10;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  transition: opacity 1.2s ease, transform 1.2s ease;
}
#story-stage.fade-out { opacity: 0; transform: scale(1.1); pointer-events: none; }

.star {
  position: absolute; border-radius: 50%; background: #fff;
  animation: twinkle var(--dur) ease-in-out infinite alternate;
}
@keyframes twinkle {
  0% { opacity: 0.15; transform: scale(0.8); }
  100% { opacity: 1; transform: scale(1.2); }
}
.meteor {
  position: absolute; width: 2px; height: 2px; background: #fff;
  border-radius: 50%; opacity: 0; animation: meteor linear infinite;
}
.meteor::after {
  content: ''; position: absolute; top: 0; left: 0;
  width: 50px; height: 1px;
  background: linear-gradient(to left, rgba(255,255,255,0.7), transparent);
  transform-origin: left center; transform: rotate(215deg);
}
@keyframes meteor {
  0% { opacity: 0; transform: translate(0,0); }
  5% { opacity: 1; } 70% { opacity: 1; }
  100% { opacity: 0; transform: translate(-250px,250px); }
}

#story-title {
  font-size: clamp(1.4rem, 5vw, 2.2rem);
  color: #f6c343; text-shadow: 0 0 24px rgba(246,195,67,0.5);
  margin-bottom: 8px; letter-spacing: 3px; position: relative; z-index: 2;
}
#story-subtitle {
  font-size: clamp(0.75rem, 2.5vw, 1rem);
  color: rgba(245,230,202,0.5); letter-spacing: 2px;
  margin-bottom: 36px; position: relative; z-index: 2;
}
#story-text-area {
  position: relative; width: 100%; max-width: 600px; min-height: 120px;
  display: flex; align-items: center; justify-content: center;
  text-align: center; z-index: 2;
}
.story-line {
  position: absolute; width: 100%;
  font-size: clamp(0.95rem, 3.2vw, 1.2rem);
  line-height: 1.8; color: #f5e6ca; opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.5s ease, transform 0.5s ease; padding: 0 16px;
}
.story-line.active { opacity: 1; transform: translateY(0); }
.story-line.exit { opacity: 0; transform: translateY(-12px); }
#story-progress {
  margin-top: 40px; font-size: clamp(0.8rem, 2.5vw, 1rem);
  color: rgba(245,230,202,0.5); letter-spacing: 1px; position: relative; z-index: 2;
}
#skip-hint {
  position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
  font-size: 0.8rem; color: rgba(245,230,202,0.3); z-index: 2;
  pointer-events: none; opacity: 0; transition: opacity 1s ease;
}

/* ===== 主场景 ===== */
#main-stage {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; z-index: 5;
  transition: opacity 0.8s ease;
  background: radial-gradient(ellipse at center, #1a1a3e 0%, #0a0a1a 70%);
}
#main-stage.visible { opacity: 1; pointer-events: auto; }
#main-svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

#corner-icons {
  position: fixed; top: 16px; right: 16px;
  font-size: 1.6rem; z-index: 100; opacity: 0;
  transition: opacity 0.8s ease; user-select: none;
  display: flex; gap: 4px;
}
#corner-icons.show { opacity: 1; }

@keyframes glowBreathe {
  0%, 100% { filter: url(#glow-soft); }
  50% { filter: url(#glow-strong); }
}

/* HTML 星星按钮 */
.star-btn {
  position: absolute;
  width: 60px; height: 60px;
  border-radius: 50%;
  border: 2px solid #555;
  background: rgba(26,26,62,0.8);
  color: #555;
  font-size: 28px;
  line-height: 56px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s ease;
  transform: translate(-50%, -50%);
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.star-btn:active { transform: translate(-50%, -50%) scale(0.95); }
.star-btn.lit {
  border-color: #f6c343;
  color: #f6c343;
  background: rgba(42,26,0,0.9);
  box-shadow: 0 0 20px rgba(246,195,67,0.6), 0 0 40px rgba(246,195,67,0.3);
  cursor: default;
  pointer-events: none;
}

/* 拼字槽位 */
.puzzle-slot {
  position: absolute;
  width: 60px; height: 60px;
  border: 2px dashed rgba(246,195,67,0.4);
  border-radius: 8px;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
.puzzle-slot-num {
  position: absolute;
  width: 60px; text-align: center;
  color: rgba(246,195,67,0.3);
  font-size: 14px;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
/* 拼字方块 */
.puzzle-char {
  position: absolute;
  width: 56px; height: 56px;
  border: 1.5px solid #f6c343;
  border-radius: 8px;
  background: #1a1a3e;
  color: #f5e6ca;
  font-size: 30px;
  line-height: 52px;
  text-align: center;
  cursor: grab;
  transform: translate(-50%, -50%);
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  z-index: 2;
  transition: box-shadow 0.2s ease;
}
.puzzle-char:active { cursor: grabbing; }
.puzzle-char.locked {
  cursor: default;
  border-color: #f6c343;
  box-shadow: 0 0 15px rgba(246,195,67,0.5);
  pointer-events: none;
}
</style>
</head>
<body>

<!-- ===== 密码保护界面 ===== -->
<div id="password-screen">
  <div class="password-box">
    <div class="password-icon">🔒</div>
    <div class="password-title">需要密码才能查看</div>
    <div class="password-subtitle">请输入密码来解锁这份祝福</div>
    <input type="password" id="password-input" class="password-input" placeholder="请输入密码" maxlength="20">
    <br>
    <button id="password-btn" class="password-btn">解锁 ✨</button>
    <div id="password-error" class="password-error">密码错误，请重试</div>
  </div>
</div>

<!-- ===== 故事阶段 ===== -->
<div id="story-stage">
  <div id="story-title"></div>
  <div id="story-subtitle"></div>
  <div id="story-text-area"></div>
  <div id="story-progress"></div>
  <div id="skip-hint">👆 点击屏幕跳过</div>
</div>

<!-- ===== 主场景 ===== -->
<div id="main-stage">
  <!-- HTML 星星覆盖层 -->
  <div id="stars-overlay" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;display:none;"></div>
  <!-- HTML 拼字覆盖层 -->
  <div id="puzzle-overlay" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;display:none;"></div>
  <svg id="main-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 800" preserveAspectRatio="xMidYMid meet">
    <defs>
      <filter id="particle-glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="fw-glow" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="card-shadow" x="-10%" y="-5%" width="120%" height="115%">
        <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="rgba(0,0,0,0.5)"/>
      </filter>
      <linearGradient id="cardBorder" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f6c343"/>
        <stop offset="50%" stop-color="#f0a6ca"/>
        <stop offset="100%" stop-color="#f6c343"/>
      </linearGradient>
      <clipPath id="tear-clip"><rect id="tear-rect" x="0" y="0" width="500" height="800"/></clipPath>
      <!-- 星星发光（用于点亮后的星星） -->
      <filter id="star-glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
        <feMerge>
          <feMergeNode in="b"/>
          <feMergeNode in="b"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <!-- 图层 -->
    <g id="particles-layer"></g>
    <g id="fireworks-layer"></g>
    <g id="confetti-layer"></g>
    <g id="stars-layer" opacity="0"></g>
    <g id="puzzle-layer" opacity="0"></g>

    <!-- 星星进度 -->
    <text id="star-progress" x="250" y="680" text-anchor="middle" font-family="Georgia,'宋体',serif"
          font-size="16" fill="rgba(245,230,202,0.5)" opacity="0">✦ 0 / 8</text>
    <!-- 星星阶段提示 -->
    <text id="star-hint" x="250" y="720" text-anchor="middle" font-family="Georgia,'宋体',serif"
          font-size="14" fill="rgba(245,230,202,0.4)" opacity="0">👆 点亮所有星星</text>
    <!-- 拼字阶段提示 -->
    <text id="puzzle-hint" x="250" y="400" text-anchor="middle" font-family="Georgia,'宋体',serif"
          font-size="14" fill="rgba(245,230,202,0.4)" opacity="0">👆 拖拽文字到正确位置</text>

    <!-- 步骤1：标题文字 -->
    <g id="step1-title" opacity="0" pointer-events="none">
      <text x="250" y="340" text-anchor="middle" font-family="Georgia,'宋体',serif"
            font-size="48" font-weight="bold" fill="#f6c343" filter="url(#glow-soft)">生日快乐</text>
      <text x="250" y="385" text-anchor="middle" font-family="Georgia,'宋体',serif"
            font-size="18" fill="#f0a6ca" filter="url(#glow-soft)">Birthday Gift</text>
    </g>

    <!-- 礼物盒（带 clipPath） -->
    <g id="gift-box" transform="translate(250, 650)" opacity="0" clip-path="url(#tear-clip)" pointer-events="none">
      <rect x="-60" y="0" width="120" height="100" rx="8" fill="#f0a6ca" stroke="#e896b8" stroke-width="1.5"/>
      <rect x="-5" y="0" width="10" height="100" fill="#f6c343" opacity="0.9"/>
      <rect x="-60" y="44" width="120" height="12" fill="#f6c343" opacity="0.9"/>
      <rect x="-65" y="-18" width="130" height="22" rx="6" fill="#e896b8" stroke="#d48aaa" stroke-width="1"/>
      <rect x="-5" y="-18" width="10" height="22" fill="#f6c343" opacity="0.9"/>
      <g transform="translate(0, -28)">
        <path d="M 0,0 C -8,-18 -35,-22 -30,-8 C -25,2 -8,4 0,0 Z" fill="#f6c343" stroke="#d4a520" stroke-width="0.8"/>
        <path d="M 0,0 C 8,-18 35,-22 30,-8 C 25,2 8,4 0,0 Z" fill="#f6c343" stroke="#d4a520" stroke-width="0.8"/>
        <ellipse cx="0" cy="0" rx="5" ry="4" fill="#d4a520"/>
      </g>
    </g>

    <!-- 光泽扫过 -->
    <rect id="sheen-overlay" x="200" y="380" width="100" height="140" rx="8" fill="white" opacity="0" pointer-events="none"/>

    <!-- ===== 祝福卡片 ===== -->
    <g id="blessing-card" opacity="0" transform="translate(250,500) scale(0.8)">
      <rect x="-190" y="-240" width="380" height="480" rx="22"
            fill="#0e0e24" stroke="url(#cardBorder)" stroke-width="3" filter="url(#card-shadow)"/>
      <rect x="-170" y="-220" width="340" height="440" rx="16"
            fill="none" stroke="#f6c343" stroke-width="0.5" opacity="0.2"/>
      <!-- 四角花饰 -->
      <g opacity="0.4" fill="#f6c343">
        <path d="M-165,-205 Q-155,-215 -145,-205 Q-155,-195 -165,-205Z"/>
        <path d="M145,-205 Q155,-215 165,-205 Q155,-195 145,-205Z"/>
        <path d="M-165,205 Q-155,215 -145,205 Q-155,195 -165,205Z"/>
        <path d="M145,205 Q155,215 165,205 Q155,195 145,205Z"/>
      </g>
      <!-- 爱心 -->
      <g id="card-heart" opacity="0" transform="translate(0,-185)">
        <path d="M 0,8 C -2,-2 -12,-10 -18,-6 C -24,-2 -22,8 -18,12 C -12,18 0,24 0,24 C 0,24 12,18 18,12 C 22,8 24,-2 18,-6 C 12,-10 2,-2 0,8Z"
              fill="#f0a6ca" stroke="#e899b8" stroke-width="0.8" opacity="0.7"/>
      </g>
      <line x1="-130" y1="-165" x2="130" y2="-165" stroke="#f6c343" stroke-width="0.8" opacity="0.25"/>
      <text id="card-title" x="0" y="-130" text-anchor="middle" font-family="Georgia,'宋体',serif"
            font-size="26" font-weight="bold" fill="#f6c343" filter="url(#glow-soft)" opacity="0">🎂 生日快乐 🎂</text>
      <text id="card-name" x="0" y="-95" text-anchor="middle" font-family="Georgia,'宋体',serif"
            font-size="15" fill="#f0a6ca" opacity="0"></text>
      <line id="card-divider" x1="-110" y1="-72" x2="110" y2="-72" stroke="#f6c343" stroke-width="0.5" opacity="0"/>
      <g id="blessings-group"></g>
      <line x1="-130" y1="175" x2="130" y2="175" stroke="#f6c343" stroke-width="0.8" opacity="0.25"/>
      <clipPath id="card-clip"><rect x="-190" y="-240" width="380" height="480" rx="22"/></clipPath>
      <rect id="card-sheen" x="-190" y="-240" width="80" height="480" fill="white" opacity="0" clip-path="url(#card-clip)"/>
    </g>

    <!-- 通关祝贺文字 -->
    <g id="congrats-text" opacity="0">
      <text x="250" y="380" text-anchor="middle" font-family="Georgia,'宋体',serif"
            font-size="36" font-weight="bold" fill="#f6c343" filter="url(#glow-soft)">你真棒！🫰</text>
    </g>

    <!-- ===== 最终快递提醒（全屏独立画面） ===== -->
    <g id="delivery-screen" opacity="0">
      <text id="delivery-line1" x="250" y="370" text-anchor="middle" font-family="Georgia,'宋体',serif"
            font-size="22" fill="#f5e6ca" opacity="0">对了，还有一件事——</text>
      <text id="delivery-line2" x="250" y="415" text-anchor="middle" font-family="Georgia,'宋体',serif"
            font-size="20" fill="#f5e6ca" opacity="0">给你的生日礼物正在快递ing</text>
      <text id="delivery-line3" x="250" y="455" text-anchor="middle" font-family="Georgia,'宋体',serif"
            font-size="22" fill="#f6c343" filter="url(#glow-soft)" opacity="0">要记得查收哦 😉</text>
      <text id="delivery-sign" x="420" y="530" text-anchor="end" font-family="Georgia,'宋体',serif"
            font-size="15" fill="rgba(245,230,202,0.5)" opacity="0">—— wy, 2026.6.26</text>
    </g>
  </svg>
</div>

<div id="corner-icons"><span>🎂</span><span>🌙</span></div>

<script>
// ============================================================
// 【用户可修改内容区】
// ============================================================
const stories = [
  { text: "以前我们天天分享日常，比上班还勤快。", dur: 3000 },
  { text: "有一次从网吧出来遇上大暴雨，在街边饭馆躲雨——而你化身线上饭搭子，陪我一起吃。", dur: 4500 },
  { text: "作业不会的时候，第一个想到的就是你。", dur: 3000 },
  { text: "偶尔还蹭用你的工具箱，嘿嘿😜", dur: 3000 },
  { text: "记得那次下雨你来给我送过伞，我却连伞都不会折，怪不好意思的，哈哈哈哈。", dur: 4000 },
  { text: "说好了到龙南你请我喝杨村米酒，不许赖账！", dur: 3000 },
  { text: "\"嘿嘿一言为定！🐕截图为证\"——我可是有证据的。", dur: 3500 },
  { text: "晚安晚安晚安——说了好多遍，每一遍都是认真的。", dur: 3500 },
  { text: "今天是你的生日，想跟你说——", dur: 3000 },
  { text: "生日快乐呀，真的希望你一切都好。", dur: 3500 },
  { text: "接下来送上我的祝福呀😄", dur: 3000 },
];
const totalStories = 12;
const birthdayName = "LSQ";

// ============================================================
// 密码保护配置
// ============================================================
const PASSWORD = "20260626";  // ⚠️ 在这里修改密码！

// ============================================================
// 实现代码
// ============================================================
(function () {
  'use strict';

  // ============================================================
  // 密码验证
  // ============================================================
  const passwordScreen = document.getElementById('password-screen');
  const passwordInput = document.getElementById('password-input');
  const passwordBtn = document.getElementById('password-btn');
  const passwordError = document.getElementById('password-error');

  function checkPassword() {
    const input = passwordInput.value.trim();
    if (input === PASSWORD) {
      passwordScreen.classList.add('hidden');
      // 密码正确后才开始播放故事
      setTimeout(() => {
        startStory();
      }, 800);
    } else {
      passwordError.classList.add('show');
      passwordInput.value = '';
      passwordInput.focus();
      setTimeout(() => {
        passwordError.classList.remove('show');
      }, 2000);
    }
  }

  passwordBtn.addEventListener('click', checkPassword);
  passwordInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      checkPassword();
    }
  });

  // 初始隐藏故事，等待密码验证
  const storyStage = document.getElementById('story-stage');
  storyStage.style.display = 'none';

  // 密码验证通过后启动故事
  window.startStory = function() {
    storyStage.style.display = 'flex';
    initStory();
  };

  // --- DOM ---
  const storyStage     = document.getElementById('story-stage');
  const storyTitle     = document.getElementById('story-title');
  const storySubtitle  = document.getElementById('story-subtitle');
  const storyTextArea  = document.getElementById('story-text-area');
  const storyProgress  = document.getElementById('story-progress');
  const skipHint       = document.getElementById('skip-hint');

  // ============================================================
  // 音效系统（Web Audio API）

  var audioCtx = null;

  /** 初始化 AudioContext（需在用户交互后调用） */
  function initAudio() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { /* 静默失败 */ }
  }

  /** 播放简单音效 */
  function playTone(freq, duration, vol) {
    if (!audioCtx) return;
    try {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol || 0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) { /* 静默失败 */ }
  }

  /** "叮"清脆声 — 点亮星星/放对字块 */

    playTone(523, 0.3, 0.25);

  // 粒子
  function startParticles() {
    const colors = ['#f6c343','#f0a6ca','#ffeaa7','#fab1a0','#a29bfe','#fd79a8'];
    const ps = [];
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const r = 2+Math.random()*5, sx = Math.random()*VW, sy = VH+Math.random()*60;
      const c = svgEl('circle', {cx:sx, cy:sy, r:r, fill:colors[i%colors.length], filter:'url(#particle-glow)', opacity:0});
      particlesLayer.appendChild(c);
      ps.push({el:c, baseX:sx, y:sy, speed:20+Math.random()*40, wAmp:8+Math.random()*16,
        wFreq:0.3+Math.random(), phase:Math.random()*Math.PI*2, opacity:0, fadeIn:true});
    }
    let last = performance.now();
    function tick(now) {
      const dt = (now-last)/1000; last = now;
      for (const p of ps) {
        p.y -= p.speed*dt;
        const wx = p.baseX + Math.sin(now/1000*p.wFreq+p.phase)*p.wAmp;
        if (p.fadeIn) { p.opacity=Math.min(p.opacity+dt*2,0.8); if(p.opacity>=0.8)p.fadeIn=false; }
        if (p.y<40) p.opacity = Math.max(p.opacity-dt*3,0);
        if (p.y<-15||p.opacity<=0) {
          p.y=VH+Math.random()*60; p.baseX=Math.random()*VW; p.speed=20+Math.random()*40;
          p.opacity=0; p.fadeIn=true; p.phase=Math.random()*Math.PI*2;
        }
        p.el.setAttribute('cx',wx); p.el.setAttribute('cy',p.y); p.el.setAttribute('opacity',p.opacity);
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  // 单颗烟花
  function fireOneFirework(cx, cy, color) {
    const n = 20 + Math.floor(Math.random()*14);
    const g = svgEl('g', {filter:'url(#fw-glow)'});
    fireworksLayer.appendChild(g);
    // 中心闪光
    g.appendChild(svgEl('circle', {cx:cx, cy:cy, r:5, fill:'white', opacity:1}));
    setTimeout(function(){ if(g.firstChild) g.firstChild.setAttribute('opacity','0'); }, 180);
    // 火花
    const sparks = [];
    for (let j=0; j<n; j++) {
      const a = j/n*Math.PI*2, d = 30+Math.random()*60;
      const s = svgEl('circle', {cx:cx, cy:cy, r:1.5+Math.random()*1.5, fill:color, opacity:1});
      g.appendChild(s);
      sparks.push({el:s, tx:cx+Math.cos(a)*d, ty:cy+Math.sin(a)*d, ox:cx, oy:cy});
    }
    const st = performance.now();
    function anim(now) {
      const t = Math.min((now-st)/900,1), e = 1-Math.pow(1-t,3);
      for (const s of sparks) {
        s.el.setAttribute('cx', s.ox+(s.tx-s.ox)*e);
        s.el.setAttribute('cy', s.oy+(s.ty-s.oy)*e + t*t*25);
        s.el.setAttribute('opacity', 1-t);
      }
      if (t<1) requestAnimationFrame(anim);
      else fireworksLayer.removeChild(g);
    }
    requestAnimationFrame(anim);
  }

  // 彩纸
  function launchConfetti(count) {
    const colors = ['#f6c343','#f0a6ca','#a29bfe','#fd79a8','#00cec9','#fdcb6e','#55efc4','#fab1a0'];
    for (let i = 0; i < count; i++) {
      const w=4+Math.random()*6, h=8+Math.random()*12;
      const x=Math.random()*VW, y=-20-Math.random()*100;
      const col=colors[Math.floor(Math.random()*colors.length)];
      const rot=Math.random()*360;
      const r = svgEl('rect', {x:x, y:y, width:w, height:h, rx:1, fill:col, opacity:0.9,
        transform:'rotate('+rot+','+(x+w/2)+','+(y+h/2)+')'});
      confettiLayer.appendChild(r);
      const spd=80+Math.random()*120, drift=(Math.random()-0.5)*60, rs=(Math.random()-0.5)*720;
      const st=performance.now(), delay=Math.random()*2500;
      (function(rr,x,y,rot){
        function anim(now){
          const el=now-st-delay; if(el<0){requestAnimationFrame(anim);return;}
          const t=el/1000, cy=y+spd*t, cx=x+drift*Math.sin(t*2), rv=rot+rs*t;
          const op=cy>VH?0:Math.max(0,1-t*0.12);
          rr.setAttribute('x',cx); rr.setAttribute('y',cy);
          rr.setAttribute('transform','rotate('+rv+','+(cx+w/2)+','+(cy+h/2)+')');
          rr.setAttribute('opacity',op);
          if(op>0) requestAnimationFrame(anim);
          else if(confettiLayer.contains(rr)) confettiLayer.removeChild(rr);
        }
        requestAnimationFrame(anim);
      })(r,x,y,rot);
    }
  }

  // ============================================================
  // 阶段 A：点亮星星（HTML 按钮覆盖层，最可靠的点击方式）

  var STAR_COUNT = 8;

  /** 将 SVG 坐标转为屏幕百分比位置 */
  function svgToPercent(svgX, svgY) {
    var svg = document.getElementById('main-svg');
    var rect = svg.getBoundingClientRect();
    var scaleX = rect.width / VW;
    var scaleY = rect.height / VH;
    var scale = Math.min(scaleX, scaleY);
    var offsetX = (rect.width - VW * scale) / 2;
    var offsetY = (rect.height - VH * scale) / 2;
    return {
      left: ((offsetX + svgX * scale) / rect.width * 100) + '%',
      top: ((offsetY + svgY * scale) / rect.height * 100) + '%'
    };
  }

  // ============================================================
  // 阶段 B：拼出"生日快乐"（HTML 拖拽，最可靠）
  // ============================================================
  var PUZZLE_CHARS = ['生', '日', '快', '乐'];
  var puzzleSlots = [];   // {el, numEl, char, filled, svgX, svgY}
  var puzzleBlocks = [];  // {el, char, x, y, locked, slotIdx}
  var lockedCount = 0;
  var draggingIdx = null;
  var dragOffX = 0, dragOffY = 0;

  /** 创建拼字游戏界面（HTML 元素） */
  function createPuzzle() {
    puzzleOverlay.innerHTML = '';
    puzzleOverlay.style.display = 'block';
    puzzleSlots = [];
    puzzleBlocks = [];
    lockedCount = 0;
    draggingIdx = null;

    // 4 个槽位（上方居中）
    var slotSize = 60;
    var slotGap = 20;
    var totalW = PUZZLE_CHARS.length * slotSize + (PUZZLE_CHARS.length - 1) * slotGap;
    var startSvgX = (VW - totalW) / 2;

    for (var i = 0; i < PUZZLE_CHARS.length; i++) {
      var sx = startSvgX + i * (slotSize + slotGap) + slotSize / 2;
      var sy = 280;
      var pct = svgToPercent(sx, sy);

      var slotEl = document.createElement('div');
      slotEl.className = 'puzzle-slot';
      slotEl.style.left = pct.left;
      slotEl.style.top = pct.top;
      puzzleOverlay.appendChild(slotEl);

      var numEl = document.createElement('div');
      numEl.className = 'puzzle-slot-num';
      numEl.style.left = pct.left;
      numEl.style.top = pct.top;
      numEl.textContent = ['①','②','③','④'][i];
      puzzleOverlay.appendChild(numEl);

      puzzleSlots.push({ el: slotEl, numEl: numEl, char: PUZZLE_CHARS[i], filled: false, svgX: sx, svgY: sy });
    }

    // 4 个字块（打乱顺序，散落在下方）
    var blockChars = PUZZLE_CHARS.slice();
    for (var i = blockChars.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = blockChars[i]; blockChars[i] = blockChars[j]; blockChars[j] = tmp;
    }

    var blockSvgY = 520;
    var blockSvgPositions = [];
    for (var i = 0; i < 4; i++) {
      var bx;
      var attempts = 0;
      do {
        bx = 80 + Math.random() * (VW - 160);
        attempts++;
      } while (attempts < 50 && blockSvgPositions.some(function(p) { return Math.abs(p - bx) < 70; }));
      blockSvgPositions.push(bx);
    }

    for (var i = 0; i < blockChars.length; i++) {
      var bx = blockSvgPositions[i];
      var by = blockSvgY + (Math.random() - 0.5) * 30;
      var pct = svgToPercent(bx, by);

      var charEl = document.createElement('div');
      charEl.className = 'puzzle-char';
      charEl.textContent = blockChars[i];
      charEl.style.left = pct.left;
      charEl.style.top = pct.top;
      puzzleOverlay.appendChild(charEl);

      // 拖拽事件
      (function(idx, el) {
        el.addEventListener('mousedown', function(e) { e.preventDefault(); startDrag(idx, e.clientX, e.clientY); });
        el.addEventListener('touchstart', function(e) { e.preventDefault(); var t = e.touches[0]; startDrag(idx, t.clientX, t.clientY); }, {passive:false});
      })(i, charEl);

      puzzleBlocks.push({ el: charEl, char: blockChars[i], svgX: bx, svgY: by, locked: false, slotIdx: -1 });
    }

    // 全局拖拽事件
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd);
    document.addEventListener('touchmove', onDragMove, {passive:false});
    document.addEventListener('touchend', onDragEnd);
  }

  /** 开始拖拽 */
  function startDrag(idx, clientX, clientY) {
    if (puzzleBlocks[idx].locked) return;
    draggingIdx = idx;
    var b = puzzleBlocks[idx];
    // 记录鼠标相对于元素中心的偏移（屏幕坐标）
    var rect = b.el.getBoundingClientRect();
    dragOffX = clientX - (rect.left + rect.width / 2);
    dragOffY = clientY - (rect.top + rect.height / 2);
    b.el.style.zIndex = '10';
    b.el.style.transition = 'none';
  }

  /** 拖拽移动 */
  function onDragMove(e) {
    if (draggingIdx === null) return;
    e.preventDefault();
    var clientX, clientY;
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }
    var b = puzzleBlocks[draggingIdx];
    // 直接用屏幕坐标定位（CSS left/top 百分比）
    var overlayRect = puzzleOverlay.getBoundingClientRect();
    var newLeft = ((clientX - dragOffX - overlayRect.left) / overlayRect.width * 100);
    var newTop = ((clientY - dragOffY - overlayRect.top) / overlayRect.height * 100);
    b.el.style.left = newLeft + '%';
    b.el.style.top = newTop + '%';
  }

  /** 拖拽结束 */
  function onDragEnd(e) {
    if (draggingIdx === null) return;
    var b = puzzleBlocks[draggingIdx];
    b.el.style.zIndex = '2';

    // 检查是否落在对应槽位
    var matched = false;
    for (var i = 0; i < puzzleSlots.length; i++) {
      var s = puzzleSlots[i];
      if (s.char === b.char && !s.filled) {
        // 比较当前拖拽位置与槽位位置（都用 SVG 坐标）
        var blockRect = b.el.getBoundingClientRect();
        var slotRect = s.el.getBoundingClientRect();
        var dx = (blockRect.left + blockRect.width/2) - (slotRect.left + slotRect.width/2);
        var dy = (blockRect.top + blockRect.height/2) - (slotRect.top + slotRect.height/2);
        var dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < 45) {
          // 放对位置 → 锁定
          matched = true;
          b.locked = true;
          b.slotIdx = i;
          s.filled = true;
          lockedCount++;
          // 吸附到槽位
          b.el.style.transition = 'all 0.2s ease';
          b.el.style.left = s.el.style.left;
          b.el.style.top = s.el.style.top;
          b.el.classList.add('locked');
          playDing();

          if (lockedCount >= PUZZLE_CHARS.length) {
            setTimeout(onPuzzleComplete, 300);
          }
          break;
        }
      }
    }

    if (!matched) {
      // 放错 → 弹回
      playThud();
      b.el.style.transition = 'all 0.3s ease-out';
      b.el.style.left = svgToPercent(b.svgX, b.svgY).left;
      b.el.style.top = svgToPercent(b.svgX, b.svgY).top;
      setTimeout(function() { b.el.style.transition = ''; }, 350);
    }

    draggingIdx = null;
  }

  /** 拼字通关动画 */
  function onPuzzleComplete() {
    playChord();
    puzzleHint.setAttribute('opacity', '0');
    // 所有字块发光放大
    puzzleBlocks.forEach(function(b) {
      b.el.style.transition = 'all 0.4s ease';
      b.el.style.boxShadow = '0 0 25px rgba(246,195,67,0.8)';
      b.el.style.transform = 'translate(-50%, -50%) scale(1.2)';
    });
    setTimeout(function() {
      puzzleOverlay.style.transition = 'opacity 0.5s ease';
      puzzleOverlay.style.opacity = '0';
      setTimeout(function() {
        puzzleOverlay.style.display = 'none';
        puzzleOverlay.style.opacity = '1';
        startCelebration();
      }, 500);
    }, 600);
  }

  // 弹性运动
  function bounceIn(el, fromY, toY, cx, dur, cb) {
    const st = performance.now();
    function step(now) {
      const t = Math.min((now-st)/dur,1);
      const e = t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
      const os = t>0.7?Math.sin((t-0.7)/0.3*Math.PI*2)*8*(1-t):0;
      el.setAttribute('transform','translate('+cx+','+(fromY+(toY-fromY)*e+os)+')');
      if(t<1) requestAnimationFrame(step);
      else { el.setAttribute('transform','translate('+cx+','+toY+')'); if(cb)cb(); }
    }
    requestAnimationFrame(step);
  }

  function swingBox(el, cx, cy, cb) {
    const angles = [-5,5,-5,0]; let idx=0;
    (function next(){
      if(idx>=angles.length){if(cb)cb();return;}
      el.setAttribute('transform','translate('+cx+','+cy+') rotate('+angles[idx]+',0,0)');
      idx++; setTimeout(next,200);
    })();
  }

  function fadeIn(el, dur, cb) {
    el.style.transition='opacity '+dur+'ms ease';
    el.setAttribute('opacity','1');
    if(cb) setTimeout(cb, dur);
  }
  function fadeOut(el, dur, cb) {
    el.style.transition='opacity '+dur+'ms ease';
    el.setAttribute('opacity','0');
    if(cb) setTimeout(cb, dur);
  }

  // ============================================================
  // 主动画序列
  // ============================================================
  function startReveal() {
    startParticles();

    // 步骤1：标题文字
    setTimeout(function(){
      fadeIn(step1Title, 500, function(){
        step1Title.style.animation = 'glowBreathe 1.5s ease-in-out infinite';
      });
    }, 300);

    // 2.5s：标题缩小淡出
    setTimeout(function(){
      step1Title.style.animation='';
      step1Title.style.transition='opacity 0.5s ease, transform 0.5s ease';
      step1Title.setAttribute('opacity','0');
      const st=performance.now();
      function shrink(now){
        const t=Math.min((now-st)/500,1);
        step1Title.setAttribute('transform','translate(250,360) scale('+(1-t*0.3)+') translate(-250,-360)');
        if(t<1) requestAnimationFrame(shrink);
      }
      requestAnimationFrame(shrink);
    }, 2500);

    // 3.2s：礼物盒弹出
    setTimeout(function(){
      giftBox.setAttribute('opacity','1');
      bounceIn(giftBox, 600, 420, 250, 800, function(){
        swingBox(giftBox, 250, 420, function(){
          setTimeout(tearOpen, 300);
        });
      });
    }, 3200);
  }

  // 撕开效果
  function tearOpen() {
    const st = performance.now();
    function anim(now) {
      const p = Math.min((now-st)/TEAR_DURATION,1);
      const e = p<0.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
      tearRect.setAttribute('x', (500*(1-e))/2);
      tearRect.setAttribute('width', 500*(1-e));
      if(p>0.1&&p<0.8) sheenOverlay.setAttribute('opacity', 0.4*Math.sin((p-0.1)/0.7*Math.PI));
      else sheenOverlay.setAttribute('opacity','0');
      if(p<1) requestAnimationFrame(anim);
      else onTearDone();
    }
    requestAnimationFrame(anim);
  }

  // ============================================================
  // 撕开完成 → 烟花表演秀 → 祝福卡
  // ============================================================
  function onTearDone() {
    // 礼物盒淡出
    giftBox.style.transition='opacity 0.6s ease';
    giftBox.setAttribute('opacity','0');

    // 画面渐暗
    setTimeout(function() {
      mainStage.style.transition = 'background 0.8s ease';
      mainStage.style.background = 'radial-gradient(ellipse at center, #0a0a1a 0%, #050510 70%)';
    }, 300);

    // 启动星星阶段
    setTimeout(function() {
      createStars();
    }, 800);
  }

  /** 从星星阶段过渡到拼字阶段 */
  function startPuzzlePhase() {
    // 星星进度淡出
    starProgress.style.transition = 'opacity 0.4s ease';
    starProgress.setAttribute('opacity', '0');

    // 拼字淡入
    setTimeout(function() {
      createPuzzle();
      puzzleHint.setAttribute('opacity', '1');
    }, 500);
  }

  // ============================================================
  // 阶段 C：庆祝收尾
  // ============================================================
  function startCelebration() {
    // 恢复背景
    mainStage.style.transition = 'background 0.8s ease';
    mainStage.style.background = 'radial-gradient(ellipse at center, #1a1a3e 0%, #0a0a1a 70%)';

    cornerIcons.classList.add('show');

    // "你真棒！🫰" 祝贺文字
    congratsText.style.transition = 'opacity 0.6s ease';
    congratsText.setAttribute('opacity', '1');
    setTimeout(function() {
      congratsText.style.transition = 'opacity 0.8s ease';
      congratsText.setAttribute('opacity', '0');
    }, 3000);

    // 烟花表演秀
    var fwColors = ['#f6c343','#f0a6ca','#a29bfe','#fd79a8','#00cec9','#fdcb6e','#e17055','#55efc4','#74b9ff'];

    setTimeout(function(){
      fireOneFirework(120, 150, fwColors[0]);
      fireOneFirework(380, 180, fwColors[1]);
      fireOneFirework(250, 120, fwColors[2]);
      launchConfetti(30);
    }, 300);

    setTimeout(function(){
      fireOneFirework(80, 200, fwColors[3]);
      fireOneFirework(420, 140, fwColors[4]);
      fireOneFirework(200, 100, fwColors[5]);
      fireOneFirework(320, 160, fwColors[6]);
      launchConfetti(25);
    }, 1200);

    setTimeout(function(){
      fireOneFirework(100, 130, fwColors[7]);
      fireOneFirework(250, 90,  fwColors[8]);
      fireOneFirework(400, 150, fwColors[0]);
      fireOneFirework(170, 170, fwColors[2]);
      fireOneFirework(330, 110, fwColors[4]);
      launchConfetti(35);
    }, 2200);

    setTimeout(function(){
      fireOneFirework(150, 160, fwColors[1]);
      fireOneFirework(350, 130, fwColors[3]);
      fireOneFirework(250, 180, fwColors[5]);
      fireOneFirework(420, 100, fwColors[7]);
      launchConfetti(20);
    }, 3200);

    setTimeout(function(){
      fireOneFirework(200, 140, fwColors[6]);
      fireOneFirework(300, 120, fwColors[8]);
      fireOneFirework(250, 160, fwColors[0]);
      launchConfetti(15);
    }, 4200);

    // 烟花层淡出
    setTimeout(function(){
      fireworksLayer.style.transition='opacity 1s ease';
      fireworksLayer.setAttribute('opacity','0');
      confettiLayer.style.transition='opacity 1s ease';
      confettiLayer.setAttribute('opacity','0');
    }, 5500);

    // 祝福卡弹入
    setTimeout(function(){
      blessingCard.style.transition='opacity 0.8s ease';
      blessingCard.setAttribute('opacity','1');
      var st=performance.now();
      function pop(now){
        var t=Math.min((now-st)/900,1);
        var e=t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
        var os=t>0.7?Math.sin((t-0.7)/0.3*Math.PI*2)*0.06*(1-t):0;
        blessingCard.setAttribute('transform','translate(250,500) scale('+(0.8+0.2*e+os)+')');
        if(t<1) requestAnimationFrame(pop);
        else blessingCard.setAttribute('transform','translate(250,500) scale(1)');
      }
      requestAnimationFrame(pop);
    }, 6000);

    // 卡片标题
    setTimeout(function(){
      cardTitle.style.transition='opacity 0.6s ease';
      cardTitle.setAttribute('opacity','1');
    }, 6600);

    // 爱心
    setTimeout(function(){
      cardHeart.style.transition='opacity 0.6s ease';
      cardHeart.setAttribute('opacity','1');
    }, 6800);

    // 名字
    if(birthdayName){
      setTimeout(function(){
        cardName.textContent='Dear '+birthdayName;
        cardName.style.transition='opacity 0.6s ease';
        cardName.setAttribute('opacity','1');
      }, 7000);
    }

    // 分隔线
    setTimeout(function(){
      cardDivider.style.transition='opacity 0.6s ease';
      cardDivider.setAttribute('opacity','0.5');
    }, 7100);

    // 逐行祝福语
    var blessings = [
      "愿你每天都开开心心的",
      "愿你所有的努力都不被辜负",
      "愿你前路繁花，万事胜意",
      "愿你眼里有光，心中有暖",
      "愿你永远被这个世界温柔以待",
    ];
    blessings.forEach(function(text, i){
      setTimeout(function(){
        var t = svgEl('text', {
          x:0, y:String(-35+i*36), 'text-anchor':'middle',
          'font-family':"Georgia, '宋体', serif", 'font-size':'15',
          fill:'#f5e6ca', opacity:'0'
        });
        t.textContent = text;
        blessingsGroup.appendChild(t);
        setTimeout(function(){
          t.style.transition='opacity 0.6s ease';
          t.setAttribute('opacity','1');
        }, 50);
      }, 7500+i*450);
    });

    // 光泽扫过
    var blessEndTime = 7500 + blessings.length * 450 + 400;
    setTimeout(function(){
      var st=performance.now();
      function shine(now){
        var t=Math.min((now-st)/1200,1);
        cardSheen.setAttribute('x', -190+t*460);
        cardSheen.setAttribute('opacity', 0.25*Math.sin(t*Math.PI));
        if(t<1) requestAnimationFrame(shine);
      }
      requestAnimationFrame(shine);
    }, blessEndTime);

    // 卡片淡出 → 快递提醒
    setTimeout(function(){
      fadeOut(blessingCard, 1200, function(){
        showDeliveryScreen();
      });
    }, blessEndTime + 1400);
  }

  // ============================================================
  // 最终画面：快递提醒
  // ============================================================
  function showDeliveryScreen() {
    deliveryScreen.setAttribute('opacity','1');

    // 逐行淡入
    setTimeout(function(){
      deliveryLine1.style.transition='opacity 0.8s ease';
      deliveryLine1.setAttribute('opacity','1');
    }, 400);

    setTimeout(function(){
      deliveryLine2.style.transition='opacity 0.8s ease';
      deliveryLine2.setAttribute('opacity','1');
    }, 1400);

    setTimeout(function(){
      deliveryLine3.style.transition='opacity 0.8s ease';
      deliveryLine3.setAttribute('opacity','1');
    }, 2400);

    // 署名
    setTimeout(function(){
      deliverySign.style.transition='opacity 1s ease';
      deliverySign.setAttribute('opacity','1');
    }, 3200);
  }

})();
</script>
